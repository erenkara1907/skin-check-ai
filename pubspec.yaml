name: skincheck_ai
description: "AI-powered skin analysis app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.9.0

  # Camera & ML
  camera: ^0.11.1
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.12.0

  # Network
  dio: ^5.7.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # UI
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1
  confetti: ^0.8.0

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Utils
  logger: ^2.5.0
  share_plus: ^10.1.4
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
